<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Grainger URL Builder</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
body { font-family: 'Inter', sans-serif; background: #f0f4f8; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
.container { background: #fff; padding: 30px 40px; border-radius: 12px; box-shadow: 0 8px 25px rgba(0,0,0,0.1); width: 500px; max-width: 95%; }
h2 { text-align: center; margin-bottom: 25px; color: #1f2937; }
label { display: block; margin-top: 15px; font-weight: 600; color: #4b5563; }
input[type="text"] { width: 100%; padding: 10px 12px; margin-top: 6px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; box-sizing: border-box; }
.checkbox-label { display: flex; align-items: center; margin-top: 15px; font-weight: 500; color: #4b5563; }
input[type="checkbox"] { margin-right: 8px; width: 18px; height: 18px; cursor: pointer; accent-color: #3b82f6; }
button { margin-top: 25px; width: 100%; padding: 12px; background: #3b82f6; color: #fff; font-weight: 600; font-size: 16px; border: none; border-radius: 10px; cursor: pointer; }
button:hover { background: #2563eb; }
#output { margin-top: 25px; padding: 15px; background: #f9fafb; border: 1px solid #d1d5db; border-radius: 10px; word-wrap: break-word; font-size: 14px; color: #111827; min-height: 50px; }
.copy-btn { margin-top: 10px; width: 100%; padding: 10px; background: #10b981; color: #fff; font-weight: 600; font-size: 14px; border: none; border-radius: 10px; cursor: pointer; display: none; }
.copy-btn:hover { background: #059669; }
.copied { background: #6b7280 !important; }
</style>
</head>
<body>

<div class="container">
    <h2>Grainger URL Builder</h2>

    <label for="baseUrl">Base URL:</label>
    <input type="text" id="baseUrl" placeholder="Paste Grainger URL here">

    <label for="campaignCode">New Campaign / Tracking Code:</label>
    <input type="text" id="campaignCode" placeholder="e.g., EMP-_-Product-_-PaintingEquipment-_-4March26-_-EN">

    <label class="checkbox-label">
        <input type="checkbox" id="inStock"> Add In-Stock Filter
    </label>

    <button onclick="generateURL()">Generate URL</button>
    <button class="copy-btn" id="copyBtn" onclick="copyURL()">Copy URL</button>

    <div id="output"></div>
</div>

<script>
function generateURL() {
    let baseUrl = document.getElementById('baseUrl').value.trim();
    let campaignCode = document.getElementById('campaignCode').value.trim();
    let includeStock = document.getElementById('inStock').checked;

    if (!baseUrl || !campaignCode) {
        alert('Please enter both Base URL and Campaign Code.');
        return;
    }

    // Strip hash from URL before parsing
    baseUrl = baseUrl.split('#')[0];

    let urlObj;
    try { urlObj = new URL(baseUrl); } catch { alert('Invalid URL!'); return; }

    let params = new URLSearchParams(urlObj.search);

    // Remove old tracking codes
    params.delete('cm_sp');
    params.delete('cm_mmc');

    // Get decoded q param
    let decodedQ = params.get('q') || '';

    // If inStock is OFF — only strip :inStockAtBranch:DC, keep everything else
    if (!includeStock) {
        decodedQ = decodedQ.replace(/:inStockAtBranch:DC/g, '');
        decodedQ = decodedQ.trim();
    }

    // Detect if q is filter-style or plain search term
    // Filter if: starts with : OR contains known Grainger filter keywords
    let isFilterQ = decodedQ.startsWith(':') ||
                    decodedQ.includes(':topSeller') ||
                    decodedQ.includes(':brand') ||
                    decodedQ.includes(':shopBy') ||
                    decodedQ.includes(':inStockAtBranch');
    let isSearchQ = decodedQ !== '' && !isFilterQ;

    // Detect clearance URL
    let isClearance = decodedQ.includes(':shopBy:clearance') ||
                      (params.get('filterValue') || '').toLowerCase() === 'clearance';

    // Get filterTemplate only if exists in original URL
    let filterTemplate = params.get('filterTemplate') || '';

    // Get type with default
    let type = params.get('type') || 'category';

    // Get cptype if present
    let cptype = params.get('cptype') || '';

    // Remove all params we handle manually
    params.delete('filterTemplate');
    params.delete('type');
    params.delete('q');
    params.delete('filterType');
    params.delete('filterName');
    params.delete('filterValue');
    params.delete('isWildCard');
    params.delete('cptype');
    params.delete('nls');
    params.delete('uq');
    params.delete('text');
    params.delete('remove_token');
    params.delete('code');
    params.delete('isIgnrCategoryPrediction');
    params.delete('sort');
    params.delete('pagesize');

    // Helper: encode value preserving + for spaces
    function encodeQ(val) {
        return encodeURIComponent(val).replace(/%20/g, '+');
    }

    // Build final URL parts
    let parts = [];

    // Do NOT encode campaign code so & stays literal
    parts.push('cm_mmc=' + campaignCode);

    if (includeStock) {

        if (isSearchQ) {
            // Plain search term — append :topSeller:inStockAtBranch:DC
            let baseQ = decodedQ + ':topSeller:inStockAtBranch:DC';
            parts.push('q=' + encodeQ(baseQ));
            parts.push('text=' + encodeQ(decodedQ));
            parts.push('remove_token=' + encodeQ(decodedQ));
            parts.push('filterType=shopBy');
            parts.push('filterName=Shop+By');
            parts.push('filterValue=DC');
            parts.push('isWildCard=false');
            parts.push('type=' + encodeURIComponent(type));
            if (cptype || type) parts.push('cptype=' + encodeURIComponent(cptype || type));

        } else {
            // Filter-style or no q — append :inStockAtBranch:DC
            let baseQ = decodedQ || ':topSeller';
            if (!baseQ.includes(':inStockAtBranch:DC')) {
                baseQ = baseQ + ':inStockAtBranch:DC';
            }
            parts.push('q=' + encodeQ(baseQ));
            if (filterTemplate) parts.push('filterTemplate=' + encodeURIComponent(filterTemplate));
            parts.push('filterType=shopBy');
            parts.push('filterName=Shop+By');
            parts.push('filterValue=DC');
            parts.push('isWildCard=false');
            parts.push('type=' + encodeURIComponent(type));
            if (cptype) parts.push('cptype=' + encodeURIComponent(cptype));
        }

    } else if (isClearance) {
        // Clearance URL without in-stock
        parts.push('q=' + encodeQ(decodedQ));
        if (filterTemplate) parts.push('filterTemplate=' + encodeURIComponent(filterTemplate));
        parts.push('filterType=shopBy');
        parts.push('filterName=Shop+By');
        parts.push('filterValue=clearance');
        parts.push('isWildCard=false');
        parts.push('type=' + encodeURIComponent(type));
        if (cptype) parts.push('cptype=' + encodeURIComponent(cptype));

    } else {
        // Plain category or search URL, no in-stock
        if (decodedQ) parts.push('q=' + encodeQ(decodedQ));
        if (filterTemplate) parts.push('filterTemplate=' + encodeURIComponent(filterTemplate));
        parts.push('type=' + encodeURIComponent(type));
        if (cptype) parts.push('cptype=' + encodeURIComponent(cptype));
    }

    // Append any remaining original params
    params.forEach((value, key) => {
        parts.push(encodeURIComponent(key) + '=' + encodeURIComponent(value));
    });

    let fullURL = urlObj.origin + urlObj.pathname + '?' + parts.join('&');

    document.getElementById('output').textContent = fullURL;

    let copyBtn = document.getElementById('copyBtn');
    copyBtn.style.display = 'block';
    copyBtn.textContent = 'Copy URL';
    copyBtn.classList.remove('copied');
}

function copyURL() {
    let output = document.getElementById('output').textContent;
    if (!output) return;

    navigator.clipboard.writeText(output).then(() => {
        let copyBtn = document.getElementById('copyBtn');
        copyBtn.textContent = 'Copied!';
        copyBtn.classList.add('copied');
        setTimeout(() => {
            copyBtn.textContent = 'Copy URL';
            copyBtn.classList.remove('copied');
        }, 2000);
    }).catch(() => {
        alert('Failed to copy. Please copy manually.');
    });
}
</script>

</body>
</html>
